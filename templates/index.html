		class Object3D extends Component { }

		Object3D.schema = {
			object: { type: Types.Ref }
		};

		class Button extends Component { }

		Button.schema = {
			// button states: [none, hovered, pressed]
			currState: { type: Types.String, default: 'none' },
			prevState: { type: Types.String, default: 'none' },
			action: { type: Types.Ref, default: () => { } }
		};

		class ButtonSystem extends System {

			execute( /*delta, time*/ ) {

				this.queries.buttons.results.forEach( entity => {

					const button = entity.getMutableComponent( Button );
					const buttonMesh = entity.getComponent( Object3D ).object;
					if ( button.currState == 'none' ) {

						buttonMesh.scale.set( 1, 1, 1 );

					} else {

						buttonMesh.scale.set( 1.1, 1.1, 1.1 );

					}

					if ( button.currState == 'pressed' && button.prevState != 'pressed' ) {

						button.action();

					}

					// preserve prevState, clear currState
					// HandRaySystem will update currState
					button.prevState = button.currState;
					button.currState = 'none';

				} );

			}

		}

		ButtonSystem.queries = {
			buttons: {
				components: [ Button ]
			}
		};

		class Draggable extends Component { }

		Draggable.schema = {
			// draggable states: [detached, hovered, to-be-attached, attached, to-be-detached]
			state: { type: Types.String, default: 'none' },
			originalParent: { type: Types.Ref, default: null },
			attachedPointer: { type: Types.Ref, default: null }
		};

		class DraggableSystem extends System {

			execute( /*delta, time*/ ) {

				this.queries.draggable.results.forEach( entity => {

					const draggable = entity.getMutableComponent( Draggable );
					const object = entity.getComponent( Object3D ).object;
					if ( draggable.originalParent == null ) {

						draggable.originalParent = object.parent;

					}

					switch ( draggable.state ) {

						case 'to-be-attached':
							draggable.attachedPointer.children[ 0 ].attach( object );
							draggable.state = 'attached';
							break;
						case 'to-be-detached':
							draggable.originalParent.attach( object );
							draggable.state = 'detached';
							break;
						default:
							object.scale.set( 1, 1, 1 );

					}

				} );

			}

		}

		DraggableSystem.queries = {
			draggable: {
				components: [ Draggable ]
			}
		};

		class Intersectable extends TagComponent { }

		class HandRaySystem extends System {

			init( attributes ) {

				this.handPointers = attributes.handPointers;

			}

			execute( /*delta, time*/ ) {

				this.handPointers.forEach( hp => {

					let distance = null;
					let intersectingEntity = null;
					this.queries.intersectable.results.forEach( entity => {

						const object = entity.getComponent( Object3D ).object;
						const intersections = hp.intersectObject( object, false );
						if ( intersections && intersections.length > 0 ) {

							if ( distance == null || intersections[ 0 ].distance < distance ) {

								distance = intersections[ 0 ].distance;
								intersectingEntity = entity;

							}

						}

					} );
					if ( distance ) {

						hp.setCursor( distance );
						if ( intersectingEntity.hasComponent( Button ) ) {

							const button = intersectingEntity.getMutableComponent( Button );
							if ( hp.isPinched() ) {

								button.currState = 'pressed';

							} else if ( button.currState != 'pressed' ) {

								button.currState = 'hovered';

							}

						}

						if ( intersectingEntity.hasComponent( Draggable ) ) {

							const draggable = intersectingEntity.getMutableComponent( Draggable );
							const object = intersectingEntity.getComponent( Object3D ).object;
							object.scale.set( 1.1, 1.1, 1.1 );
							if ( hp.isPinched() ) {

								if ( ! hp.isAttached() && draggable.state != 'attached' ) {

									draggable.state = 'to-be-attached';
									draggable.attachedPointer = hp;
									hp.setAttached( true );

								}

							} else {

								if ( hp.isAttached() && draggable.state == 'attached' ) {

									console.log( 'hello' );
									draggable.state = 'to-be-detached';
									draggable.attachedPointer = null;
									hp.setAttached( false );

								}

							}

						}

					} else {

						hp.setCursor( 1.5 );

					}

				} );

			}

		}

		HandRaySystem.queries = {

				components: [ Intersectable ]
			}

		class InstructionSystem extends System {

		class OffsetFromCamera extends Component { }

		OffsetFromCamera.schema = {

		class NeedCalibration extends TagComponent { }

		class CalibrationSystem extends System {

			init( attributes ) {

				this.camera = attributes.camera;
				this.renderer = attributes.renderer;

			}

			execute() {
				this.queries.needCalibration.results.forEach(entity => {
					const offset = entity.getComponent(OffsetFromCamera);
					const object = entity.getComponent(Object3D).object;
					
					if (this.renderer.xr.isPresenting) {
						const xrCamera = this.renderer.xr.getCamera();
						object.position.x = xrCamera.position.x + offset.x;
						object.position.y = xrCamera.position.y + offset.y;
						object.position.z = xrCamera.position.z + offset.z;
					} else {
						object.position.x = this.camera.position.x + offset.x;
						object.position.y = this.camera.position.y + offset.y;
						object.position.z = this.camera.position.z + offset.z;
					}

					// Only remove calibration for non-toggle buttons
					if (!object.name.includes('toggle')) {
						entity.removeComponent(NeedCalibration);
					}
				});
			}

		}

		CalibrationSystem.queries = {

		let isMouseDown = false;
		let previousMousePosition = { x: 0, y: 0 };
		const mouseSensitivity = 0.002;
		const rotationQuaternion = new THREE.Quaternion();
		const rotationEuler = new THREE.Euler(0, 0, 0, 'YXZ');

		function handleMouseDown(event) {
			isMouseDown = true;
			previousMousePosition.x = event.clientX;
			previousMousePosition.y = event.clientY;
		}

		function handleMouseUp() {
			isMouseDown = false;
		}

		function handleMouseMove(event) {
			if (!isMouseDown) return;

			const deltaX = event.clientX - previousMousePosition.x;
			const deltaY = event.clientY - previousMousePosition.y;

			// Update rotation euler
			rotationEuler.setFromQuaternion(camera.quaternion);
			
			// Apply rotations
			rotationEuler.y -= deltaX * mouseSensitivity;
			rotationEuler.x = Math.max(
				-Math.PI / 2.1, 
				Math.min(Math.PI / 2.1, 
				rotationEuler.x - deltaY * mouseSensitivity)
			);

			// Convert back to quaternion
			camera.quaternion.setFromEuler(rotationEuler);

			previousMousePosition.x = event.clientX;
			previousMousePosition.y = event.clientY;
		}

		// Voice Recognition Functions
		function initVoiceRecognition() {
			if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
				const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
				recognition = new SpeechRecognition();

				recognition.lang = 'en-US';
				recognition.interimResults = false;
				recognition.continuous = false;

				recognition.onstart = () => {
					isListening = true;
					updateVoiceButtonState();
					console.log('Voice recognition started');
					// Remove the listening message once recognition actually starts
					if (chatMessages.length > 0 && chatMessages[chatMessages.length - 1].isLoading) {
						removeChatMessage(chatMessages.length - 1);
					}
				};

				recognition.onend = () => {
					isListening = false;
					updateVoiceButtonState();
					console.log('Voice recognition ended');
				};

				recognition.onerror = (event) => {
					isListening = false;
					updateVoiceButtonState();
					console.error('Speech recognition error:', event.error);

					// Remove any loading messages
					if (chatMessages.length > 0 && chatMessages[chatMessages.length - 1].isLoading) {
						removeChatMessage(chatMessages.length - 1);
					}

					let errorMessage = 'Speech recognition error: ';
					switch(event.error) {
						case 'not-allowed':
							errorMessage += 'Microphone access denied. Please allow microphone permissions.';
							break;
						case 'no-speech':
							errorMessage += 'No speech detected. Please try again.';
							// Auto-restart listening for no-speech errors
							setTimeout(() => {
								if (voiceChatVisible) startVoiceRecognition();
							}, 1000);
							break;
						default:
							errorMessage += event.error;
					}
					addChatMessage(errorMessage, false);
				};

				recognition.onresult = (event) => {
					if (event.results[0] && event.results[0].isFinal) {
						const transcript = event.results[0][0].transcript.trim();
						if (transcript) {
							addChatMessage(`You: ${transcript}`, true);
							generateAIResponse(transcript);
						}
					}
				};
			}
		}

		function startVoiceRecognition() {
			if (recognition && !isListening) {
				try {
					recognition.start();
					addChatMessage('🎤 Listening... Speak now!', false, true);
				} catch (error) {
					console.error('Failed to start voice recognition:', error);
					addChatMessage('Failed to start voice recognition. Please check microphone permissions.', false);
				}
			} else if (isListening) {
				addChatMessage('Already listening... Please speak!', false);
			} else {
				addChatMessage('Voice recognition not available. Please check browser compatibility.', false);
			}
		}

		// AI Response Function
		async function generateAIResponse(userMessage) {
			try {
				addChatMessage('AI is thinking...', false, true);

				// Using the Hugging Face Inference API approach from the original ChatUI
				const response = await fetch('https://api-inference.huggingface.co/models/google/gemma-2-9b-it', {
					method: 'POST',
					headers: {
						'Authorization': `Bearer ${HUGGING_FACE_API_KEY}`,
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						inputs: `User: ${userMessage}\nAssistant:`,
						parameters: {
							max_new_tokens: 150,
							temperature: 0.7,
							do_sample: true,
							top_p: 0.9,
							return_full_text: false
						}
					})
				});

				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}

				const data = await response.json();
				let aiResponse = '';

				if (Array.isArray(data) && data[0] && data[0].generated_text) {
					aiResponse = data[0].generated_text.trim();
					// Clean up the response to remove any "Assistant:" prefix
					aiResponse = aiResponse.replace(/^Assistant:\s*/, '');
				} else if (data.error) {
					aiResponse = `API Error: ${data.error}`;
				} else {
					aiResponse = 'Sorry, I could not generate a response.';
				}

				// Remove the loading message
				removeChatMessage(chatMessages.length - 1);
				addChatMessage(`AI: ${aiResponse}`, false);

				// Text-to-speech for AI response
				speakText(aiResponse);

				// Auto-restart voice recognition after AI response
				setTimeout(() => {
					if (voiceChatVisible && !isListening) {
						startVoiceRecognition();
					}
				}, 2000); // Wait 2 seconds after AI response

			} catch (error) {
				console.error('Error generating AI response:', error);
				removeChatMessage(chatMessages.length - 1);
				addChatMessage('Sorry, I encountered an error generating a response.', false);
			}
		}

		function addChatMessage(message, isUser = false, isLoading = false) {
			const messageData = {

				timestamp: Date.now()

		function updateChatDisplay() {
			if (!voiceChatScreen || !voiceChatVisible) return;

			// Clear existing message displays
			const existingMessages = voiceChatScreen.children.filter(child =>
				child.userData && child.userData.isMessage
			);
			existingMessages.forEach(msg => voiceChatScreen.remove(msg));

			// Display recent messages (last 6 messages to fit on screen)
			const recentMessages = chatMessages.slice(-6);
			const startY = 0.5;
			const messageHeight = 0.15;

			recentMessages.forEach((messageData, index) => {
				const yPosition = startY - (index * messageHeight);
				const messageGroup = createMessageDisplay(messageData, yPosition);
				voiceChatScreen.add(messageGroup);
			});
		}

		function createMessageDisplay(messageData, yPosition) {
			const messageGroup = new THREE.Group();
			messageGroup.userData.isMessage = true;

			// Create message background
			const bgWidth = 1.8;
			const bgHeight = 0.12;
			const bgGeometry = new THREE.PlaneGeometry(bgWidth, bgHeight);
			const bgColor = messageData.isUser ? 0x0066cc : (messageData.isLoading ? 0x666666 : 0x333333);
			const bgMaterial = new THREE.MeshPhongMaterial({
				color: bgColor,
				transparent: true,
				opacity: 0.7
			});
			const bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
			bgMesh.position.set(messageData.isUser ? 0.1 : -0.1, yPosition, 0.01);
			messageGroup.add(bgMesh);

let scaleF=1.1;

// Create pitched roof
const roofHeight = 0.5;
const roofWidth = 5;
const roofDepth = 5;

const roofGeometry = new THREE.BufferGeometry();
const vertices = new Float32Array([
    // Front face
    -roofWidth/2, 0, roofDepth/2,
    roofWidth/2, 0, roofDepth/2,
    0, roofHeight, 0,
    
    // Back face
    -roofWidth/2, 0, -roofDepth/2,
    roofWidth/2, 0, -roofDepth/2,
    0, roofHeight, 0,
    
    // Left face
    -roofWidth/2, 0, -roofDepth/2,
    -roofWidth/2, 0, roofDepth/2,
    0, roofHeight, 0,
    
    // Right face
    roofWidth/2, 0, -roofDepth/2,
    roofWidth/2, 0, roofDepth/2,
    0, roofHeight, 0,
]);

const indices = new Uint16Array([
    0, 1, 2,  // Front
    3, 4, 5,  // Back
    6, 7, 8,  // Left
    9, 10, 11 // Right
]);

roofGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
roofGeometry.setIndex(new THREE.BufferAttribute(indices, 1));
roofGeometry.computeVertexNormals();

const roofMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x000000,
    shininess: 30,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.9
});

const roof = new THREE.Mesh(roofGeometry, roofMaterial);
roof.position.set(4.00, 2.8, 2.50);
roof.scale.set(6, 6, 6);
scene.add(roof);

// Add GLTFLoader import
const modelsFolders = [
				{ 
					// folder: 'squid_game',
					// scale: [.01, .01, .01],  
					folder: 'apartment_construction', 
					scale: [1*scaleF, 1*scaleF, 1*scaleF], 
					position: [4.00, -0.2, 2.50],
					rotation: [0, 0, 0], 
					animation: false 
				}
			];

			const loader = new GLTFLoader();
			modelsFolders.forEach((modelData) => {
				loader.load(
					`assets/models/${modelData.folder}/scene.gltf`,
					(gltf) => {
						const model = gltf.scene;
						model.rotation.set(...(modelData.rotation || [0, 0, 0]));
						
						if (modelData.animation) {
							model.mixer = new THREE.AnimationMixer(model);
							model.mixer.clipAction(gltf.animations[0]).play();
						}

						model.scale.set(...modelData.scale);
						model.position.set(...modelData.position);

						scene.add(model);
						models.push(model);
					},
					undefined,
					(error) => {
						console.error(`An error occurred while loading ${modelData.folder}:`, error);
					}
				);
			});

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

function animate() {
    const delta = clock.getDelta();
    const elapsedTime = clock.elapsedTime;

    // Update menu toggle button and menu panel position relative to camera
    const menuToggleButton = scene.getObjectByName('menuToggle');
    const menuPanel = scene.getObjectByName('menuPanel');
    const voiceChatScreenObj = scene.getObjectByName('voiceChatScreen');

    if (menuToggleButton && menuPanel) {
        if (renderer.xr.isPresenting) {
            const xrCamera = renderer.xr.getCamera();

            // Toggle button positioning
            const toggleDistance = 0.5;
            const toggleOffset = new THREE.Vector3(-0.3, 0.15, -toggleDistance);
            toggleOffset.applyQuaternion(xrCamera.quaternion);
            menuToggleButton.position.copy(xrCamera.position).add(toggleOffset);
            menuToggleButton.quaternion.copy(xrCamera.quaternion);

            // Menu panel positioning
            const menuDistance = 1; // Slightly further back than toggle
            const menuOffset = new THREE.Vector3(0.4, 0, -menuDistance); // Offset to the right
            menuOffset.applyQuaternion(xrCamera.quaternion);
            menuPanel.position.copy(xrCamera.position).add(menuOffset);

            // Make menu face the camera with slight angle
            menuPanel.quaternion.copy(xrCamera.quaternion);
            menuPanel.rotateY(-Math.PI / 12); // Slight angle for better visibility

            // Voice chat screen positioning (center front of camera)
            if (voiceChatScreenObj && voiceChatVisible) {
                const chatDistance = 3; // Distance from camera
                const chatOffset = new THREE.Vector3(0, 0, -chatDistance); // Directly in front
                chatOffset.applyQuaternion(xrCamera.quaternion);
                voiceChatScreenObj.position.copy(xrCamera.position).add(chatOffset);

                // Make screen face the camera directly
                voiceChatScreenObj.quaternion.copy(xrCamera.quaternion);
            }

        } else {
            // Non-VR positioning
            const toggleDistance = 0.5;
            const toggleOffset = new THREE.Vector3(-0.3, 0.15, -toggleDistance);
            toggleOffset.applyQuaternion(camera.quaternion);
            menuToggleButton.position.copy(camera.position).add(toggleOffset);
            menuToggleButton.quaternion.copy(camera.quaternion);

            // Menu panel positioning
            const menuDistance = 1;
            const menuOffset = new THREE.Vector3(0.4, 0, -menuDistance);
            menuOffset.applyQuaternion(camera.quaternion);
            menuPanel.position.copy(camera.position).add(menuOffset);

            // Make menu face the camera with slight angle
            menuPanel.quaternion.copy(camera.quaternion);
            menuPanel.rotateY(-Math.PI / 12);

            // Voice chat screen positioning (center front of camera)
            if (voiceChatScreenObj && voiceChatVisible) {
                const chatDistance = 3; // Distance from camera
                const chatOffset = new THREE.Vector3(0, 0, -chatDistance); // Directly in front
                chatOffset.applyQuaternion(camera.quaternion);
                voiceChatScreenObj.position.copy(camera.position).add(chatOffset);

                // Make screen face the camera directly
                voiceChatScreenObj.quaternion.copy(camera.quaternion);
            }
        }
    }


    // Handle keyboard movement relative to camera direction
			if (!renderer.xr.isPresenting) {
				// Get forward and right vectors from camera's rotation
				const forward = new THREE.Vector3(0, 0, -1);
				const right = new THREE.Vector3(1, 0, 0);
				forward.applyQuaternion(camera.quaternion);
				right.applyQuaternion(camera.quaternion);

				// Zero out y component to keep movement horizontal
				forward.y = 0;
				right.y = 0;
				forward.normalize();
				right.normalize();

				if (keyStates['w']) {
					camera.position.addScaledVector(forward, moveSpeed);
				}
				if (keyStates['s']) {
					camera.position.addScaledVector(forward, -moveSpeed);
				}
				if (keyStates['a']) {
					camera.position.addScaledVector(right, -moveSpeed);
				}
				if (keyStates['d']) {
					camera.position.addScaledVector(right, moveSpeed);
				}
				if (keyStates['q']) {
					camera.position.y += moveSpeed;
				}
				if (keyStates['e']) {
					camera.position.y -= moveSpeed;
				}
			}

			renderer.xr.updateCamera(camera);
			world.execute(delta, elapsedTime);
			renderer.render(scene, camera);

			// Update animations for each model
			models.forEach((model) => {
				if (model && model.mixer) {
					model.mixer.update(0.016);
				}
			});

		}
