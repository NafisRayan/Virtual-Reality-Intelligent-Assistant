<!DOCTYPE html> 
 <html> 
 	<head> 
 		<title>three.js css3d - youtube</title> 
 		<meta charset="utf-8"> 
 		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"> 
 		<script src="https://cdn.tailwindcss.com"></script>
 	</head> 
 	<body class="bg-white">
 
 		<div id="container"></div> 
 		<div id="blocker" class="absolute top-0 left-0 bottom-0 right-0 hidden"></div>
 
  
 		<script type="importmap"> 
 			{ 
 				"imports": { 
 					"three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
 					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
 				} 
 			} 
 		</script> 
  
 		<script type="module"> 
  
 			import * as THREE from 'three'; 
  
 			import { TrackballControls } from 'three/addons/controls/TrackballControls.js'; 
 			import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js'; 
  
 			let camera, scene, renderer; 
 			let controls; 
  
 			function Element( elWidth, elHeight, x, y, z, rx, ry, rz, iframeSrc = 'ChatUI.html' ) { // Signature updated for width, height, and full rotation
  
 				const div = document.createElement( 'div' ); 
 				// Replace Tailwind classes with direct style manipulation for dynamic sizing
 				div.style.width = `${elWidth}px`;
 				div.style.height = `${elHeight}px`;
 				div.style.backgroundColor = 'black'; 
  
 				const iframe = document.createElement( 'iframe' ); 
 				// Replace Tailwind classes with direct style manipulation
 				iframe.style.width = `${elWidth}px`;
 				iframe.style.height = `${elHeight}px`;
 				iframe.style.border = '0px';
   
 				iframe.src = iframeSrc; 
 				div.appendChild( iframe ); 
  
 				const object = new CSS3DObject( div ); 
 				object.position.set( x, y, z ); 
 				// Update rotation to use rx, ry, rz parameters
 				object.rotation.set( rx, ry, rz ); 
  
 				return object; 
  
 			} 
  
 			init(); 
 			animate(); 
  
 			function init() { 
  
 				const container = document.getElementById( 'container' ); 
  
 				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 5000 ); 
 				camera.position.set( 500, 350, 750 ); 
  
 				scene = new THREE.Scene(); 
  
 				renderer = new CSS3DRenderer(); 
 				renderer.setSize( window.innerWidth, window.innerHeight ); 
 				container.appendChild( renderer.domElement ); 
  
 				const group = new THREE.Group(); 
 				// Define dimensions for the flat box
 				const mainFaceWidth = 400;
 				const mainFaceHeight = 400;
 				const boxDepth = 10; // Reduced depth to bring faces closer and define box thickness
 
 				// Create 6 faces for the flat box
 				// Front face
 				group.add( new Element( mainFaceWidth, mainFaceHeight, 0, 0, boxDepth / 2, 0, 0, 0 ) );
 				// Back face
 				group.add( new Element( mainFaceWidth, mainFaceHeight, 0, 0, -boxDepth / 2, 0, Math.PI, 0 ) );
 				// Left face
 				group.add( new Element( boxDepth, mainFaceHeight, -mainFaceWidth / 2, 0, 0, 0, -Math.PI / 2, 0 ) );
 				// Right face
 				group.add( new Element( boxDepth, mainFaceHeight, mainFaceWidth / 2, 0, 0, 0, Math.PI / 2, 0 ) );
 				// Top face
 				group.add( new Element( mainFaceWidth, boxDepth, 0, mainFaceHeight / 2, 0, Math.PI / 2, 0, 0 ) );
 				// Bottom face
 				group.add( new Element( mainFaceWidth, boxDepth, 0, -mainFaceHeight / 2, 0, -Math.PI / 2, 0, 0 ) );
 				
 				scene.add( group ); 
  
 				controls = new TrackballControls( camera, renderer.domElement ); 
 				controls.rotateSpeed = 4; 
  
 				window.addEventListener( 'resize', onWindowResize ); 
  
 				// Block iframe events when dragging camera 
  
 				const blocker = document.getElementById( 'blocker' ); 
 				// blocker.style.display = 'none'; // Handled by Tailwind 'hidden' class initially
  
 				controls.addEventListener( 'start', function () { 
  
 					blocker.classList.remove('hidden'); 
  
 				} ); 
 				controls.addEventListener( 'end', function () { 
  
 					blocker.classList.add('hidden'); 
  
 				} ); 
  
 			} 
  
 			function onWindowResize() { 
  
 				camera.aspect = window.innerWidth / window.innerHeight; 
 				camera.updateProjectionMatrix(); 
 				renderer.setSize( window.innerWidth, window.innerHeight ); 
  
 			} 
  
 			function animate() { 
  
 				requestAnimationFrame( animate ); 
 				controls.update(); 
 				renderer.render( scene, camera ); 
  
 			} 
  
 		</script> 
 	</body> 
 </html>
