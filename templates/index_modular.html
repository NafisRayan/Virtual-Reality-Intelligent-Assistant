<!DOCTYPE html>
<html lang="en">

<head>
    <title>three.js ve - handinput - point and drag</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
    <!-- Video Background -->
    <div class="video-background">
        <img id="video-background" src="{{ url_for('video_feed') }}" alt="Video Feed" />
    </div>

    <!-- Map Container -->
    <div class="map-container fade-in">
        <iframe src="/assets/HTML/MapLibreGLJS.html" title="Map System" id="mapIframe"></iframe>
    </div>

    <!-- Chat Container -->
    <div class="chat-container fade-in">
        <iframe src="/assets/HTML/ChatUI.html" title="Chat System" id="chatIframe"></iframe>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <nav class="navbar">
            <div class="brand">Nafis Rayan</div>
            <div id="datetime" class="datetime"></div>
        </nav>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <!-- Hugging Face Inference Client -->
    <script src="https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/dist/index.umd.js"></script>

    <!-- Main Application -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
